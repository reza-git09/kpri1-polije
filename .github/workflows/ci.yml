
name: KPRI Polije CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  php-testing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Check PHP syntax
        shell: bash
        run: |
          set -e
          find . -type f -name '*.php' \
            -not -path './.git/*' -print0 |
          while IFS= read -r -d '' file; do
            php -l "$file"
          done
